<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Paneli · Brilliant Dent</title>
  <link rel="icon" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@380;520&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body class="admin-body">
  <form id="login" class="login-card">
    <p class="kicker">Brilliant Dent</p>
    <h1 style="font-size:2.2rem">Paneli</h1>
    <label>Email<input name="email" type="email" required autocomplete="username"></label>
    <label>Fjalëkalimi<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn btn-navy" type="submit">Hyni</button>
    <p class="error" id="loginError"></p>
  </form>
  <div id="app" class="admin-shell" hidden>
    <aside class="side">
      <strong>Brilliant</strong>
      <button type="button" data-panel="staff" aria-pressed="true">Stafi</button>
      <button type="button" data-panel="hero">Hero Slider</button>
      <button type="button" data-panel="gallery">Galeria</button>
      <button type="button" data-panel="dent">Stomatologjia</button>
      <button type="button" data-panel="aesthetic">Estetika</button>
      <button type="button" data-panel="contact">Kontakti</button>
      <button type="button" data-panel="appointments">Terminet</button>
      <button type="button" data-panel="testimonials">Vlerësimet</button>
      <button type="button" data-panel="password">Fjalëkalimi</button>
      <button type="button" id="logout">Dilni</button>
      <a href="/">Shiko faqen</a>
    </aside>
    <main class="main-panel" id="panel"></main>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
